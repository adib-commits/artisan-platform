services:
  db:
    image: postgres:17-alpine
    container_name: artisan-postgres

    environment:
      POSTGRES_USER: artisan
      POSTGRES_PASSWORD: artisan
      POSTGRES_DB: artisan_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artisan -d artisan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
